name: prevent-file-change

on: # zizmor: ignore[dangerous-triggers] the action only supports pull_request_target; no PR code is checked out or run
  pull_request_target:
permissions: {}

jobs:
  check-file-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Prevent file change
        uses: xalvarez/prevent-file-change-action@440fe0989b54093ce834a504af595ee55967da4d # v3.0.2
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # Regex, /src/lang/*.json is not allowed to be changed, except for /src/lang/en.json
          pattern: '^(?!src/lang/en\.json$)src/lang/.*\.json$'
          trustedAuthors: UptimeKumaBot
